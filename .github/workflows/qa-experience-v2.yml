name: JoTrip DMC Experience V2 - QA ONLY
on:
  push:
    branches:
      - feat/dmc-experience-v2-phase1-2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-functional-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build V2
        run: npm run build
      - name: Verify invariants
        run: npm test
      - name: QA in real browser under GitHub Pages project subpath
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.58.2
          mkdir -p preview-root/jotrip-dmc
          cp -R dist/. preview-root/jotrip-dmc/
          python3 -m http.server 8877 --directory preview-root >/tmp/jotrip-v2-qa.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser) node qa/browser-qa.mjs
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jotrip-dmc-v2-review-screenshots
          path: qa-artifacts/*.png
          retention-days: 14
# This workflow intentionally does NOT deploy or replace the approved public preview.
