name: JoTrip DMC editorial QA
on:
  push:
    branches: [main, feat/editorial-multipage-v2]
  pull_request:
    branches: [main]
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static editorial site
        run: npm run build
      - name: Test source and generated pages
        run: npm test
