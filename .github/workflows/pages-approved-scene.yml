name: JoTrip DMC approved scene preview
on:
  push:
    branches:
      - feat/dmc-exact-approved-scene
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jotrip-dmc-exact-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build approved site
        run: npm run build
      - name: Lock visual and content invariants
        run: npm test
      - name: Browser QA at real GitHub Pages subpath
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.58.2
          command -v google-chrome || command -v chromium || command -v chromium-browser
          mkdir -p preview-root/jotrip-dmc
          cp -R dist/. preview-root/jotrip-dmc/
          python3 -m http.server 8877 --directory preview-root >/tmp/jotrip-qa-server.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser) node qa/browser-qa.mjs
      - name: Publish screenshot QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: jotrip-approved-visual-qa
          path: qa-artifacts/*.png
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact approved scene
        id: deployment
        uses: actions/deploy-pages@v4
